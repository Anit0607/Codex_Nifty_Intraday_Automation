name: Nifty 9:20 AM Intraday Report

on:
  schedule:
    - cron: "50 3 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD or today"
        required: false
        default: "today"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  morning-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || 'anthropic,openai' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-8' }}
      ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT || 'high' }}
      ANTHROPIC_MAX_TOKENS: ${{ vars.ANTHROPIC_MAX_TOKENS || '24000' }}
      ANTHROPIC_TIMEOUT_SECONDS: ${{ vars.ANTHROPIC_TIMEOUT_SECONDS || '2400' }}
      ANTHROPIC_WEB_SEARCH_MAX_USES: ${{ vars.ANTHROPIC_WEB_SEARCH_MAX_USES || '20' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'high' }}
      OPENAI_BACKGROUND_TIMEOUT_SECONDS: ${{ vars.OPENAI_BACKGROUND_TIMEOUT_SECONDS || '2400' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CODEX_NIFTY_INTRADAY_AUTOMATION: ${{ secrets.CODEX_NIFTY_INTRADAY_AUTOMATION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/nifty-intraday-desk/scripts/requirements.txt

      - name: Validate required secrets
        run: |
          missing=0
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing AI provider key. Add ANTHROPIC_API_KEY and/or OPENAI_API_KEY."
            missing=1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Missing ANTHROPIC_API_KEY; Anthropic provider will be skipped."
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::Missing OPENAI_API_KEY; OpenAI provider will be skipped."
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Missing TELEGRAM_BOT_TOKEN; report will be generated but Telegram delivery will be skipped."
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Missing TELEGRAM_CHAT_ID; report will be generated but Telegram delivery will be skipped."
          fi
          exit "$missing"

      - name: Generate and deliver morning report
        run: |
          python skills/nifty-intraday-desk/scripts/cloud_report_agent.py --mode morning --date "${{ github.event.inputs.date || 'today' }}"

      - name: Commit generated report
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports learning || true
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add automated morning report"
            git pull --rebase origin main
            git push
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::warning::Report was generated and Telegram delivery already ran, but GitHub artifact push failed."
            fi
          fi
