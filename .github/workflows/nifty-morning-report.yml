name: Nifty 9:20 AM Intraday Report

on:
  schedule:
    - cron: "50 3 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD or today"
        required: false
        default: "today"

permissions:
  contents: write

jobs:
  morning-report:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'high' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/nifty-intraday-desk/scripts/requirements.txt

      - name: Generate and deliver morning report
        run: |
          python skills/nifty-intraday-desk/scripts/cloud_report_agent.py --mode morning --date "${{ github.event.inputs.date || 'today' }}"

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports learning || true
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add automated morning report"
            git push
          fi

