name: Nifty 9:20 AM Intraday Report

on:
  schedule:
    - cron: "50 3 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD or today"
        required: false
        default: "today"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  morning-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'xhigh' }}
      OPENAI_BACKGROUND_TIMEOUT_SECONDS: ${{ vars.OPENAI_BACKGROUND_TIMEOUT_SECONDS || '2400' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CODEX_NIFTY_INTRADAY_AUTOMATION: ${{ secrets.CODEX_NIFTY_INTRADAY_AUTOMATION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/nifty-intraday-desk/scripts/requirements.txt

      - name: Validate required secrets
        run: |
          missing=0
          if [ -z "$OPENAI_API_KEY" ]; then
            if [ -n "$CODEX_NIFTY_INTRADAY_AUTOMATION" ]; then
              echo "::error::Detected combined secret CODEX_NIFTY_INTRADAY_AUTOMATION. GitHub secrets are not parsed from multiline values; create separate repository secrets named OPENAI_API_KEY, TELEGRAM_BOT_TOKEN, and TELEGRAM_CHAT_ID."
            fi
            echo "::error::Missing GitHub Actions secret OPENAI_API_KEY"
            missing=1
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Missing TELEGRAM_BOT_TOKEN; report will be generated but Telegram delivery will be skipped."
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Missing TELEGRAM_CHAT_ID; report will be generated but Telegram delivery will be skipped."
          fi
          exit "$missing"

      - name: Generate and deliver morning report
        run: |
          python skills/nifty-intraday-desk/scripts/cloud_report_agent.py --mode morning --date "${{ github.event.inputs.date || 'today' }}"

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports learning || true
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add automated morning report"
            git push
          fi
